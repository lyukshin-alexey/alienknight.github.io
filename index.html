<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Knight Studio</title>
    <style>
/* Базовые настройки */
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #ffffff;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    height: 100%;
}

/* 1. Главный экран (Hero) */
.hero {
    background-image: url('img/juicy-bg.jpg');
    background-size: cover;
    background-position: center;
    height: 800px; 
    display: flex;
    align-items: flex-end; 
    padding-bottom: 80px;
}

.hero-container {
    width: 100%;
    display: flex;
    justify-content: center; 
}

.steam-button {
    background-color: #21ff00; 
    color: #000;
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    text-decoration: none;
    padding: 20px 50px;
    border-radius: 5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: transform 0.2s;
}

.steam-button:hover {
    transform: scale(1.05);
}

/* 2. О студии (About Us) */
.about {
    display: flex;
    flex-direction: column;
}

.about-header {
    background-color: #ffffff;
    padding: 20px 0;
}

.about-header-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 150px; 
}

.about-logo {
    height: 80px; 
}

.about-header-content h2 {
    font-size: 32px;
    margin: 0;
    color: #111;
}

.about-team {
    background-color: #ff9800; 
    padding: 60px 0;
}

.team-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 50px;
}

.team-member {
    text-align: center;
    color: #000;
}

.avatar {
    width: 150px;
    height: 150px;
    background-color: #fff;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
}

.team-member h3 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
}

.team-text {
    font-size: 20px;
    font-weight: bold;
    color: #000;
    text-align: center;
    max-width: 400px;
}

/* 3. Блок Turbo Dudes */
.turbo-dudes {
    background-color: #ffffff;
    padding: 0;
    text-align: center;
}

.turbo-banner {
    width: 100%;
    max-width: 1200px;
    display: block;
    margin: 0 auto;
}

/* Стили для новой кнопки Play */
.play-button {
    background-color: #ff9800;
    color: #000;
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    text-decoration: none;
    padding: 15px 40px;
    border-radius: 5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.2s;
    display: inline-block;
}

.play-button:hover {
    transform: scale(1.05);
}

/* 4. Подвал */
.dorf-footer {
    background-image: url('img/dorf-bg.jpg');
    background-size: cover;
    background-position: top center;
    height: 500px; 
    position: relative;
}
    </style>
</head>
<body>

    <section class="hero">
        <div class="container hero-container">
            <a href="https://store.steampowered.com/app/4945340/" target="_blank" class="steam-button">Wishlist on Steam</a>
        </div>
    </section>

    <section class="about">
        <div class="about-header">
            <div class="container about-header-content">
                <img src="img/logo-small.png" alt="Alien Knight Logo" class="about-logo">
                <h2>About US</h2>
            </div>
        </div>
        
        <div class="about-team">
            <div class="container team-container">
                <div class="team-member">
                    <img src="img/luke.png" alt="Luke" class="avatar">
                    <h3>Luke</h3>
                </div>
                
                <div class="team-text">
                    <p>Люк отвечает за визуал, геймплей и душу. Роберт пишет код, генерирует идеи и работает за электричество.</p>
                </div>

                <div class="team-member">
                    <img src="img/robert.png" alt="Robert" class="avatar">
                    <h3>Robert</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- Измененный блок Turbo Dudes -->
    <section class="turbo-dudes">
        <div class="container">
            <img src="img/turbo-dudes.jpg" alt="Turbo Dudes" class="turbo-banner">
            
            <!-- Вместо iframe теперь отступ и красивая кнопка -->
            <div style="margin: 40px 0 80px 0;">
                <a href="/turbodudes/" class="play-button">Play Turbo Dudes</a>
            </div>

        </div>
    </section>

    <section class="dorf-footer">
        <div class="container footer-content">
        </div>
    </section>

</body>
</html>
