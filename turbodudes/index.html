<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* ЖЕЛЕЗОБЕТОННЫЙ ФУНДАМЕНТ */
      html, body {
        padding: 0;
        margin: 0;
        background-color: #121212;
        overflow: hidden;
        
        /* СЕКРЕТНОЕ ОРУЖИЕ: 
           Прибиваем тело сайта строго к видимым краям экрана. 
           Браузер больше не сможет растянуть его под адресную строку! */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
      }
      
      #unity-container {
        position: absolute;
        /* Идеальное центрирование внутри зафиксированного body */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ================= МОБИЛКА ================= */
      @media (max-width: 767px) {
        html, body {
          background-color: #231F20;
        }
        #unity-container {
          /* Теперь 100% берутся от реального видимого окна, а не мифического */
          width: 100%;
          height: 100%;
        }
      }

      /* ================= ПК (РИЛТАЙМ СКЕЙЛ) ================= */
      @media (min-width: 768px) {
        #unity-container {
          height: 100%; 
          width: calc(100% * 1080 / 2400); 
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js"; 
      
      var config = {
        dataUrl: buildUrl + "/turbodudes.data",
        frameworkUrl: buildUrl + "/turbodudes.framework.js",
        codeUrl: buildUrl + "/turbodudes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
