<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* Общие настройки для обеих версий */
      body {
        padding: 0;
        margin: 0;
        background-color: #121212;
        overflow: hidden; /* Глушим любые полосы прокрутки */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }
      
      #unity-container {
        position: relative;
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ================= МОБИЛКА (100% ЭКРАНА) ================= */
      @media (max-width: 767px) {
        body {
          background-color: #231F20;
        }
        #unity-container {
          width: 100vw;
          height: 100vh;
        }
      }

      /* ================= ПК (РИЛТАЙМ СКЕЙЛ) ================= */
      @media (min-width: 768px) {
        #unity-container {
          /* Жестко привязываемся к высоте окна браузера */
          height: 100vh; 
          /* Идеальные пропорции под оригинал 1080x2400 */
          width: calc(100vh * 1080 / 2400); 
          /* Защита на случай, если кто-то сплющит окно по горизонтали */
          max-width: 100vw; 
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      // Пути к файлам сборки
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js?v=8";
      var config = {
        dataUrl: buildUrl + "/turbodudes.data.unityweb?v=8",
        frameworkUrl: buildUrl + "/turbodudes.framework.js.unityweb?v=8",
        codeUrl: buildUrl + "/turbodudes.wasm.unityweb?v=8",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
