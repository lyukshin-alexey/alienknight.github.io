<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Запрет на зум, чтобы игра сидела как влитая -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* Общие настройки */
      body {
        padding: 0;
        margin: 0;
        background-color: #121212;
        overflow: hidden; 
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh; /* Динамическая высота для обхода адресной строки */
        width: 100vw;
      }
      
      #unity-container {
        position: relative;
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ================= МОБИЛКА ================= */
      @media (max-width: 767px) {
        body {
          background-color: #231F20;
        }
        #unity-container {
          width: 100vw;
          height: 100vh;
          height: 100dvh; /* Динамическая высота для телефона */
        }
      }

      /* ================= ПК ================= */
      @media (min-width: 768px) {
        #unity-container {
          height: 100vh; 
          width: calc(100vh * 1080 / 2400); 
          max-width: 100vw; 
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js"; 
      
      var config = {
        dataUrl: buildUrl + "/turbodudes.data",
        frameworkUrl: buildUrl + "/turbodudes.framework.js",
        codeUrl: buildUrl + "/turbodudes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
          // Костыль со звуком полностью удален
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
