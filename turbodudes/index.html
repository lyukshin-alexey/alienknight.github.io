<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* Базовый фон окна браузера */
      html, body {
        padding: 0;
        margin: 0;
        background-color: #000000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      
      @supports (height: 100dvh) {
        html, body {
          height: 100dvh;
        }
      }
      
      #unity-container {
        position: relative;
        /* Убираем все max-width и max-height, чтобы не путать Unity */
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ====================================================================== */
      /* ПРАВИЛО 1: ДЛЯ ШИРОКИХ ЭКРАНОВ (ПК, планшеты, широкие телефоны)        */
      /* Пропорция экрана шире, чем 9:20. Игра упирается в ВЫСОТУ экрана.       */
      /* ====================================================================== */
      @media (min-aspect-ratio: 9/20) {
        #unity-container {
          height: 100vh;
          width: calc(100vh * 9 / 20);
        }
        @supports (height: 100dvh) {
          #unity-container {
            height: 100dvh;
            width: calc(100dvh * 9 / 20);
          }
        }
      }

      /* ====================================================================== */
      /* ПРАВИЛО 2: ДЛЯ ОЧЕНЬ УЗКИХ ЭКРАНОВ (Сверхвытянутые телефоны)         */
      /* Пропорция экрана уже, чем 9:20. Игра упирается в ШИРИНУ экрана.        */
      /* ====================================================================== */
      @media (max-aspect-ratio: 9/20) {
        #unity-container {
          width: 100vw;
          height: calc(100vw * 20 / 9);
        }
      }
      
      /* Возвращаем тень только для больших экранов */
      @media (min-width: 768px) {
        #unity-container {
          box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js"; 
      
      // Чистый конфиг, как мы настроили на предыдущем шаге
      var config = {
        dataUrl: buildUrl + "/turbodudes.data",
        frameworkUrl: buildUrl + "/turbodudes.framework.js",
        codeUrl: buildUrl + "/turbodudes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
