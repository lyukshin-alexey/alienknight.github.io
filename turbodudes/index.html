<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* Базовый экран: черный фон, центрирование */
      html, body {
        padding: 0;
        margin: 0;
        background-color: #000000; /* Черный цвет для боковых полос */
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
      }
      
      /* Используем реальную видимую высоту экрана, если браузер это умеет */
      @supports (height: 100dvh) {
        html, body {
          height: 100dvh;
        }
      }
      
      /* ЕДИНАЯ математика пропорций (1080х2400) для любых устройств */
      #unity-container {
        position: relative;
        /* Базово отталкиваемся от ширины */
        width: 100vw;
        height: calc(100vw * 2400 / 1080);
        
        /* НО жестко запрещаем вылезать за пределы высоты экрана! */
        max-height: 100vh;
        max-width: calc(100vh * 1080 / 2400);
      }
      
      /* Те же лимиты, но для динамической высоты (dvh) */
      @supports (height: 100dvh) {
        #unity-container {
          max-height: 100dvh;
          max-width: calc(100dvh * 1080 / 2400);
        }
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Возвращаем красивую тень только для ПК */
      @media (min-width: 768px) {
        #unity-container {
          box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js"; 
      
      var config = {
        dataUrl: buildUrl + "/turbodudes.data",
        frameworkUrl: buildUrl + "/turbodudes.framework.js",
        codeUrl: buildUrl + "/turbodudes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
