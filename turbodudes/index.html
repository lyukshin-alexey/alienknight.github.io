<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Dudes</title>
    <style>
      /* Базовые стили для мобилок (на весь экран) */
      body {
        padding: 0;
        margin: 0;
        background-color: #231F20;
        overflow: hidden;
      }
      #unity-container {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
      }
      
      /* Стили для десктопа (по центру, с тенью) */
      @media (min-width: 768px) {
        body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #121212; /* Темный фон для ПК */
        }
        #unity-container {
          position: relative;
          width: 480px; /* Ширина мобильного экрана на ПК */
          height: 800px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
          border-radius: 12px;
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script>
      // Пути к файлам сборки с учетом расширения .unityweb
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/turbodudes.loader.js?v=8";
      var config = {
        dataUrl: buildUrl + "/turbodudes.data.unityweb?v=8",
        frameworkUrl: buildUrl + "/turbodudes.framework.js.unityweb?v=8",
        codeUrl: buildUrl + "/turbodudes.wasm.unityweb?v=8",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Здесь можно прикрутить прогресс-бар при желании
        }).then((unityInstance) => {
          console.log("Turbo Dudes loaded!");
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
