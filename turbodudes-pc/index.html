<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Turbo Dudes - PC Version</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <style>
      body, html {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden; 
        background-color: #2b2b2b; /* Аккуратный темно-серый фон для ПК */
        display: flex; 
        justify-content: center;
        align-items: center;
      }
      
      #unity-container {
        /* Умный размер: берем 95% от высоты окна браузера, чтобы не прилипать к краям */
        height: 95vh; 
        /* Жестко фиксируем пропорции твоей игры */
        aspect-ratio: 1080 / 2400; 
        position: relative;
        background-color: #000;
        box-shadow: 0 0 20px rgba(0,0,0,0.8); /* Красивая тень вокруг окна игры */
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      #unity-footer { display: none !important; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      // Версия для обхода кэша (можешь менять при апдейтах)
      var loaderUrl = buildUrl + "/turbodudes.loader.js?v=pc_1";
      var config = {
        dataUrl: buildUrl + "/turbodudes.data.unityweb?v=pc_1",
        frameworkUrl: buildUrl + "/turbodudes.framework.js.unityweb?v=pc_1",
        codeUrl: buildUrl + "/turbodudes.wasm.unityweb?v=pc_1",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Alien Knight",
        productName: "Turbo Dudes",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
